name: test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile package
        run: python -m compileall tool_hub

      - name: Compile server entry
        run: python -m py_compile tool_hub_server.py

      - name: Install package
        run: python -m pip install .

      - name: Verify installed package data and entrypoints
        run: |
          cd /tmp
          python -c "from tool_hub.presets import get_agent_presets; from tool_hub.mcp.adapters import load_adapter; assert any(p['id'] == 'codex' for p in get_agent_presets()); assert load_adapter('codex')"
          agent-tool-hub --help
          agent-tool-hub-web --help
          agent-tool-dock --help
          agent-tool-dock-web --help
          tool-hub --help
          tool-hub-web --help
