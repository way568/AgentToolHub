[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-hub"
version = "0.2.0"
description = "Local-first control panel for AI agent tools, Skills, and MCP servers"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[project.scripts]
agent-tool-hub = "tool_hub.cli:main"
agent-tool-hub-web = "tool_hub.server:main"
# Legacy aliases kept for migration from older public/internal names.
agent-tool-dock = "tool_hub.cli:main"
agent-tool-dock-web = "tool_hub.server:main"
tool-hub = "tool_hub.cli:main"
tool-hub-web = "tool_hub.server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tool_hub*"]

[tool.setuptools.package-data]
tool_hub = [
  "index.html",
  "data/agent-presets/*.json",
  "data/mcp-adapters/*.json",
]
